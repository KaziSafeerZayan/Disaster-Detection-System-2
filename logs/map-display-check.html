.leaflet-satellite-pane { transition: filter 500ms ease; }
.leaflet-bar, .leaflet-control-layers { background: linear-gradient(120deg,rgba(214,235,255,.055),transparent 60%), var(--map-surface) !important; border: 1px solid var(--map-line) !important; border-radius: 3px !important; box-shadow: inset 0 1px 0 var(--map-glass-edge), 0 4px 16px rgba(0,0,0,.12) !important; backdrop-filter: blur(20px) saturate(1.15); -webkit-backdrop-filter: blur(20px) saturate(1.15); }
.leaflet-bar a { background: transparent !important; border-color: var(--map-line) !important; color: var(--map-text) !important; font-size: 17px !important; font-weight: 400 !important; }
.leaflet-bar a:hover { background: color-mix(in srgb,var(--map-accent) 12%,transparent) !important; color: var(--map-accent) !important; }
.leaflet-control-layers { color: var(--map-text); font-size: 11px; }
.leaflet-control-layers-toggle { filter: grayscale(1); opacity: .65; }
.leaflet-control-attribution { background: var(--map-surface) !important; color: var(--map-muted) !important; font-size: 8px !important; padding: 3px 6px !important; }
.leaflet-control-attribution a { color: var(--map-text) !important; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip, .leaflet-tooltip { background: linear-gradient(120deg,rgba(214,235,255,.055),transparent 60%), var(--map-surface) !important; color: var(--map-text) !important; border-radius: 3px !important; box-shadow: inset 0 1px 0 var(--map-glass-edge), 0 8px 28px rgba(0,0,0,.20) !important; border: 1px solid var(--map-line) !important; backdrop-filter: blur(22px) saturate(1.15); -webkit-backdrop-filter: blur(22px) saturate(1.15); }
.leaflet-popup-content { font-size: 11px; line-height: 1.7; margin: 12px 16px !important; }
.leaflet-popup-content h4 { color: var(--map-text) !important; font-size: 12px !important; font-weight: 500 !important; margin-bottom: 8px !important; }
.leaflet-popup-content b { font-weight: 500; }
.map-status--red { color: #c18b84; }
.map-status--orange { color: #c5a066; }
.map-status--green { color: #8da997; }
:root[data-flooder-theme="light"] .map-status--red { color: #a25851; }
:root[data-flooder-theme="light"] .map-status--orange { color: #84602e; }
:root[data-flooder-theme="light"] .map-status--green { color: #4d715d; }
.leaflet-popup-close-button { color: var(--map-muted) !important; }

.sensor-marker::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--signal); }
.sensor-marker--critical { --signal: #c18b84; }
.sensor-marker--warning { --signal: #c5a066; }
.sensor-marker-anchor:hover .sensor-marker { transform: scale(1.3); box-shadow: 0 0 0 6px rgba(20,24,21,.28); }
.leaflet-control-layers { padding: 0; }

.leaflet-control-layers-toggle { width: 34px !important; height: 34px !important; background-size: 20px !important; }

:root[data-flooder-theme="light"] .map-display select { color-scheme: light; }
.map-range-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 10px; color: var(--map-muted); }
.map-range-heading label { font-weight: 400; }

.map-display input[type="range"] { accent-color: var(--map-accent); width: 100%; height: 12px; margin: 0 0 14px; cursor: pointer; }
.map-grid-toggle { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 10px; cursor: pointer; }
.map-grid-toggle input { margin: 0; accent-color: var(--map-accent); }
.map-display-panel p { color: var(--map-muted); font-size: 9px; line-height: 1.65; margin: 12px 0; }
.map-display-actions { display: flex; gap: 8px; border-top: 1px solid var(--map-line); padding-top: 12px; }
.map-display-actions button { flex: 1; background: transparent; border: 1px solid var(--map-line); color: var(--map-text); padding: 6px 5px; border-radius: 2px; font: 9px/1.5 Inter,"Segoe UI",sans-serif; cursor: pointer; }
.map-display-actions button:hover { border-color: var(--map-accent); color: var(--map-accent); }
.map-display :focus-visible, .leaflet-control-layers :focus-visible { outline: 1px solid var(--map-accent); outline-offset: 3px; }
.map-view-readout { color: var(--map-text); background: var(--map-surface); backdrop-filter: blur(16px); padding: 5px 8px; border-left: 1px solid var(--map-accent); font: 8px/1.5 ui-monospace,Consolas,monospace; letter-spacing: .02em; pointer-events: none; }
.leaflet-control-scale-line { background: var(--map-surface) !important; color: var(--map-muted); border-color: var(--map-muted); border-width: 0 1px 1px; font: 8px/1.5 ui-monospace,Consolas,monospace; text-shadow: none; }
@keyframes map-panel-enter { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
